<style>
:root{--bg:#F4F6FB;--surface:#FFFFFF;--ink:#12172B;--muted:#5B6485;--line:#E1E6F2;--accent:#1A5FF0;--red:#E5484D;
  --grad:linear-gradient(90deg,#1A5FF0 0%,#14A8F5 55%,#0FD4F0 100%);color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#090E22;--surface:#111933;--ink:#EEF1FA;--muted:#9AA4C6;--line:#222C52;--accent:#3B7BFF;--red:#FF5C61;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;place-items:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:36px 28px 28px;position:relative;overflow:hidden;display:grid;gap:18px}
.card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--grad)}
.lg{height:52px;width:auto;color:var(--ink);justify-self:center}
h1{font-size:18px;margin:6px 0 0;text-align:center}
p{margin:0;color:var(--muted);font-size:14px;text-align:center}
label{font-size:13px;font-weight:700;color:var(--muted);display:block;margin-bottom:6px}
input{width:100%;font:inherit;font-size:16px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
button{font:inherit;font-weight:800;font-size:15px;border:0;border-radius:12px;padding:14px;background:var(--accent);color:#fff;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--red);font-size:13px;font-weight:600;min-height:18px;text-align:center}
</style>

const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:u(D.s),iterations:D.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
async function tryOpen(pw,silent){
  const btn=document.getElementById("go"),err=document.getElementById("err");
  btn.disabled=true;btn.textContent="Проверяем…";err.textContent="";
  try{
    const html=await open(pw);
    try{sessionStorage.setItem("sc-pw",pw)}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    try{sessionStorage.removeItem("sc-pw")}catch(_){}
    if(!silent)err.textContent="Неверный пароль. Проверьте раскладку и регистр.";
    btn.disabled=false;btn.textContent="Открыть";
  }
}
document.getElementById("f").addEventListener("submit",e=>{e.preventDefault();tryOpen(document.getElementById("pw").value,false)});
try{const saved=sessionStorage.getItem("sc-pw");if(saved)tryOpen(saved,true)}catch(e){}
